name: Reusable - release-please

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to release-please-config.json"
        required: false
        type: string
        default: "release-please-config.json"
      manifest-file:
        description: "Path to .release-please-manifest.json"
        required: false
        type: string
        default: ".release-please-manifest.json"
      target-branch:
        description: "Branch release-please should operate on (defaults to the caller's branch)"
        required: false
        type: string
        default: ""
      runs-on:
        description: "Runner image"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      # Both optional, and both only useful together. A caller that has no release App simply
      # does not pass them - `secrets: inherit` hands a secret the repository never defined over
      # as an empty string rather than failing, which is what the token step below tests for.
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
    outputs:
      release_created:
        description: "'true' when the root package was released. Gate a publish or docker job on this. Only set for the root package - on a multi-package manifest other paths are exposed by the action as '<path>--release_created', which a reusable workflow cannot forward."
        value: ${{ jobs.release-please.outputs.release_created }}
      releases_created:
        description: "'true' when at least one release was created. Use this rather than release_created on a multi-package manifest."
        value: ${{ jobs.release-please.outputs.releases_created }}
      tag_name:
        description: "Tag of the root package's release, e.g. v1.2.3. Empty when it was not released."
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: "Version of the root package's release, e.g. 1.2.3 - the tag without its prefix. Empty when it was not released."
        value: ${{ jobs.release-please.outputs.version }}
      sha:
        description: "Commit the root package's release was cut from."
        value: ${{ jobs.release-please.outputs.sha }}
      paths_released:
        description: "JSON array of the released package paths. The one to iterate over on a multi-package manifest."
        value: ${{ jobs.release-please.outputs.paths_released }}
      prs:
        description: "JSON array of the release pull requests opened or updated by this run."
        value: ${{ jobs.release-please.outputs.prs }}

jobs:
  release-please:
    name: release-please
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      pull-requests: write
    # Forwarded from the action so callers can gate follow-up jobs. Without them a caller's
    # `if: needs.release-please.outputs.release_created == 'true'` silently evaluates to false and
    # the follow-up never runs - the release is tagged, but nothing is published. The README has
    # documented that exact pattern all along.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      prs: ${{ steps.release.outputs.prs }}
    env:
      # Declared at job level so the token step's own `if` can read them: step-level `env` is not
      # available in the `if` of the step that declares it, and the `secrets` context cannot be
      # used in a job-level `if` at all. Same trick resourcepack-publish.yml uses for its
      # optional Discord webhook.
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    steps:
      # Why an App token at all: GitHub starts no workflow runs for a pull request opened with
      # the default GITHUB_TOKEN - the loop guard that stops a workflow from triggering itself.
      # A repository whose branch ruleset demands specific status checks therefore gets a release
      # PR that no check will ever run against, and it stays unmergeable forever: the repository
      # silently stops releasing. Opened as a GitHub App, the release PR is an ordinary PR and
      # `pull_request` workflows pick it up.
      #
      # Optional on purpose, because most callers have no such App. Without the two secrets this
      # step is skipped, the action falls back to GITHUB_TOKEN, and the run is byte-for-byte what
      # it was before this step existed.
      - name: Mint a release App token
        id: app-token
        if: env.RELEASE_APP_ID != '' && env.RELEASE_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch != '' && inputs.target-branch || github.ref_name }}
          # Empty when the step above was skipped. The `||` has to spell the fallback out rather
          # than leave it to the action: `token` defaults to `${{ github.token }}`, but an input
          # passed as an empty string overrides that default instead of falling back to it, and
          # release-please would authenticate with nothing.
          token: ${{ steps.app-token.outputs.token || github.token }}
